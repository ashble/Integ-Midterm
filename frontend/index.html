<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1>Simple Expense Tracker</h1>
  </header>

  <main class="container">
    <section class="card">
      <h2>Add Expense</h2>
      <form id="expenseForm">
        <label for="description">Description</label>
        <input type="text" id="description" name="description" placeholder="e.g. Lunch" required>

        <label for="amount">Amount</label>
        <input type="number" id="amount" name="amount" min="0.01" step="0.01" placeholder="0.00" required>

        <label for="category">Category</label>
        <select id="category" name="category" required>
          <option value="">-- Select category --</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Bills">Bills</option>
          <option value="Shopping">Shopping</option>
          <option value="Other">OtherS</option>
        </select>

        <label for="date">Date</label>
        <input type="date" id="date" name="date" required>

        <button type="submit" id="addBtn">Add Expense</button>
        <p id="formMessage" class="message"></p>
      </form>
    </section>
      <section class="card">
      <h2>Expenses</h2>
      <div class="toolbar">
        <label for="categoryFilter">Filter by category:</label>
        <select id="categoryFilter">
          <option value="All">All</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Bills">Bills</option>
          <option value="Shopping">Shopping</option>
          <option value="Other">Other</option>
        </select>
      </div>
  
      <div class="table-wrap">
        <table id="expenseTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Category</th>
              <th class="amount">Amount</th>
            </tr>
          </thead>
          <tbody id="expenseBody"></tbody>
        </table>
      </div>
          <p class="total">Total: $<span id="totalAmount">0.00</span></p>
    </section>
 
  </main>
  <script src="js/app.js"></script>
</body>
</html>
